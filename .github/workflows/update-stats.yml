name: Update README Stats

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh Profile Stats
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Refresh README timestamp
        shell: bash
        run: |
          timestamp="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          if grep -q '<!-- STATS_REFRESH:' README.md; then
            sed -i "s|<!-- STATS_REFRESH:.* -->|<!-- STATS_REFRESH: $timestamp -->|" README.md
          else
            printf '\n<!-- STATS_REFRESH: %s -->\n' "$timestamp" >> README.md
          fi

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit README update
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "chore: refresh README stats"
          git push
