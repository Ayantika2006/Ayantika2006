name: Update README Stats

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Generate Profile Statistics
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────────
      # Checkout repository
      # ─────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v6

      # ─────────────────────────────────────────────
      # Prepare output directory
      # ─────────────────────────────────────────────
      - name: Prepare profile directory
        run: |
          mkdir -p profile

      # ─────────────────────────────────────────────
      # Generate GitHub Stats card
      # ─────────────────────────────────────────────
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=${{ github.repository_owner }}&show_icons=true&hide_border=true&rank_icon=github&include_all_commits=true&bg_color=0D001A&title_color=9D4EDD&icon_color=C77DFF&text_color=C77DFF&border_color=7B2FBE
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # ─────────────────────────────────────────────
      # Generate Top Languages card
      # ─────────────────────────────────────────────
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&bg_color=0D001A&title_color=9D4EDD&text_color=C77DFF&border_color=7B2FBE
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # ─────────────────────────────────────────────
      # Generate local contribution streak card
      # ─────────────────────────────────────────────
      - name: Generate Contribution Streak
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timedelta, timezone

          token = os.environ["GH_TOKEN"]

          query = r'''
          query {
            viewer {
              login
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          '''

          result = subprocess.run(
              [
                  "curl",
                  "-sS",
                  "-X", "POST",
                  "-H", f"Authorization: bearer {token}",
                  "-H", "Content-Type: application/json",
                  "https://api.github.com/graphql",
                  "-d", json.dumps({"query": query})
              ],
              capture_output=True,
              text=True,
              check=True
          )

          data = json.loads(result.stdout)

          if "errors" in data:
              raise RuntimeError(
                  "GitHub GraphQL API error: "
                  + json.dumps(data["errors"])
              )

          viewer = data["data"]["viewer"]
          calendar = viewer["contributionsCollection"]["contributionCalendar"]

          days = []

          for week in calendar["weeks"]:
              for day in week["contributionDays"]:
                  days.append(day)

          days.sort(key=lambda x: x["date"])

          # Calculate current streak.
          today = datetime.now(timezone.utc).date()

          contributions = {
              datetime.strptime(day["date"], "%Y-%m-%d").date():
              day["contributionCount"]
              for day in days
          }

          current_streak = 0
          check_date = today

          # If today has no contribution yet, allow yesterday
          # to be the beginning of the current streak.
          if contributions.get(check_date, 0) == 0:
              check_date -= timedelta(days=1)

          while contributions.get(check_date, 0) > 0:
              current_streak += 1
              check_date -= timedelta(days=1)

          # Calculate longest streak.
          longest_streak = 0
          running_streak = 0
          previous_date = None

          for day in days:
              date = datetime.strptime(
                  day["date"],
                  "%Y-%m-%d"
              ).date()

              count = day["contributionCount"]

              if count > 0:
                  if (
                      previous_date is not None
                      and date == previous_date + timedelta(days=1)
                  ):
                      running_streak += 1
                  else:
                      running_streak = 1

                  longest_streak = max(
                      longest_streak,
                      running_streak
                  )
              else:
                  running_streak = 0

              previous_date = date

          total = calendar["totalContributions"]
          username = viewer["login"]

          # Escape text for SVG.
          username = (
              username
              .replace("&", "&amp;")
              .replace("<", "&lt;")
              .replace(">", "&gt;")
          )

          svg = f'''<svg width="900" height="220" viewBox="0 0 900 220"
          xmlns="http://www.w3.org/2000/svg">

            <defs>
              <linearGradient id="purpleGradient"
                x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#7B2FBE"/>
                <stop offset="50%" stop-color="#9D4EDD"/>
                <stop offset="100%" stop-color="#C77DFF"/>
              </linearGradient>

              <filter id="shadow">
                <feDropShadow
                  dx="0"
                  dy="6"
                  stdDeviation="8"
                  flood-opacity="0.35"/>
              </filter>
            </defs>

            <rect
              x="8"
              y="8"
              width="884"
              height="204"
              rx="24"
              fill="#0D001A"
              stroke="#7B2FBE"
              stroke-width="2"
              filter="url(#shadow)"
            />

            <circle
              cx="85"
              cy="83"
              r="38"
              fill="#1B0633"
              stroke="#9D4EDD"
              stroke-width="3"
            />

            <text
              x="85"
              y="96"
              text-anchor="middle"
              font-size="40"
              font-family="Arial, sans-serif"
              fill="#C77DFF">🔥</text>

            <text
              x="145"
              y="72"
              font-size="25"
              font-weight="700"
              font-family="Arial, sans-serif"
              fill="#C77DFF">
              Contribution Streak
            </text>

            <text
              x="145"
              y="105"
              font-size="15"
              font-family="Arial, sans-serif"
              fill="#C77DFF">
              @{username}
            </text>

            <line
              x1="45"
              y1="135"
              x2="855"
              y2="135"
              stroke="#3A1460"
              stroke-width="2"
            />

            <text
              x="150"
              y="175"
              text-anchor="middle"
              font-size="30"
              font-weight="700"
              font-family="Arial, sans-serif"
              fill="#9D4EDD">
              {current_streak}
            </text>

            <text
              x="150"
              y="197"
              text-anchor="middle"
              font-size="13"
              font-family="Arial, sans-serif"
              fill="#C77DFF">
              CURRENT STREAK
            </text>

            <text
              x="450"
              y="175"
              text-anchor="middle"
              font-size="30"
              font-weight="700"
              font-family="Arial, sans-serif"
              fill="#9D4EDD">
              {longest_streak}
            </text>

            <text
              x="450"
              y="197"
              text-anchor="middle"
              font-size="13"
              font-family="Arial, sans-serif"
              fill="#C77DFF">
              LONGEST STREAK
            </text>

            <text
              x="750"
              y="175"
              text-anchor="middle"
              font-size="30"
              font-weight="700"
              font-family="Arial, sans-serif"
              fill="#9D4EDD">
              {total}
            </text>

            <text
              x="750"
              y="197"
              text-anchor="middle"
              font-size="13"
              font-family="Arial, sans-serif"
              fill="#C77DFF">
              CONTRIBUTIONS
            </text>

          </svg>'''

          with open("profile/streak.svg", "w", encoding="utf-8") as file:
              file.write(svg)

          print(f"Username: {viewer['login']}")
          print(f"Current streak: {current_streak}")
          print(f"Longest streak: {longest_streak}")
          print(f"Total contributions: {total}")

          PY

      # ─────────────────────────────────────────────
      # Show generated files
      # ─────────────────────────────────────────────
      - name: Verify generated cards
        shell: bash
        run: |
          echo "Generated profile cards:"
          ls -lh profile/

          echo ""
          echo "Checking required files..."

          test -s profile/stats.svg
          test -s profile/top-langs.svg
          test -s profile/streak.svg

          echo "All profile cards generated successfully."

      # ─────────────────────────────────────────────
      # Commit generated cards
      # ─────────────────────────────────────────────
      - name: Commit Profile Cards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg
          git add profile/top-langs.svg
          git add profile/streak.svg

          if git diff --cached --quiet; then
            echo "No profile card changes detected."
            exit 0
          fi

          git commit -m "chore: update GitHub profile stats"
          git push
